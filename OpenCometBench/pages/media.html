<script>
  const v = document.getElementById('player');
  const btn = document.getElementById('play');
  // Draw an animated pattern so the video element carries real, changing pixels.
  const c = document.createElement('canvas'); c.width = 640; c.height = 360;
  const ctx = c.getContext('2d'); let t = 0;
  function draw() {
    ctx.fillStyle = '#101425'; ctx.fillRect(0, 0, 640, 360);
    for (let i = 0; i < 24; i++) {
      ctx.fillStyle = 'hsl(' + ((i * 14 + t) % 360) + ',70%,55%)';
      ctx.fillRect(20 + i * 25, 180 + Math.sin(t / 20 + i) * 90, 16, 60);
    }
    t++; requestAnimationFrame(draw);
  }
  draw();
  btn.addEventListener('click', () => {
    if (v.paused) { try { v.srcObject = c.captureStream(24); } catch (e) {} v.play(); btn.textContent = '⏸ Pause'; }
    else { v.pause(); btn.textContent = '▶ Play'; }
  });
</script>
