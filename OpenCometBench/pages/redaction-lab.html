<style>
  * { box-sizing: border-box; margin: 0; }

  header { background: #16213e; color: #fff; padding: 14px 24px; font-size: 18px; font-weight: 600; }
  main { max-width: 980px; margin: 24px auto; padding: 0 16px; }
  .card { background: #fff; border: 1px solid #dfe4ef; border-radius: 10px; padding: 20px; margin-bottom: 18px; }
  label { display: block; margin: 10px 0 4px; font-weight: 600; font-size: 13px; }
  input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid #c3cbdd; border-radius: 6px; font: inherit; }
  button, .btn { background: #1d6ef5; border: 0; color: #fff; padding: 9px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 12px; }
  .row { display: flex; gap: 12px; } .row > * { flex: 1; }
  .muted { color: #667; font-size: 12px; }
  a { color: #1d6ef5; }
  nav a { margin-right: 14px; }
  .dialog { position: fixed; inset: 0; background: rgba(10,14,30,.45); display: none; align-items: center; justify-content: center; z-index: 50; }
  .dialog.open { display: flex; }
  .dialog .box { background: #fff; border-radius: 12px; padding: 24px; width: 420px; }
  table { border-collapse: collapse; width: 100%; } td, th { border: 1px solid #dfe4ef; padding: 6px 10px; text-align: left; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .stat { background: #eef3ff; border-radius: 8px; padding: 14px; font-size: 20px; font-weight: 700; }
