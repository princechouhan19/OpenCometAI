<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Apply Online — Certificate Scheme (Government Portal)</title>
<style>* { box-sizing: border-box; margin: 0; } body { font: 14px/1.5 system-ui, sans-serif; color: #1a2233; background: #f6f7fb; } header { background: #16213e; color: #fff; padding: 14px 24px; font-size: 18px; font-weight: 600; } main { max-width: 900px; margin: 24px auto; padding: 0 16px; } .card { background: #fff; border: 1px solid #dfe4ef; border-radius: 10px; padding: 20px; margin-bottom: 18px; } label { display: block; margin: 10px 0 4px; font-weight: 600; font-size: 13px; } input { width: 100%; padding: 8px 10px; border: 1px solid #c3cbdd; border-radius: 6px; font: inherit; } button { background: #1d6ef5; border: 0; color: #fff; padding: 9px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 12px; } .ok-msg { color: #0a7d43; font-weight: 600; display: none; margin-top: 10px; }</style></head>
<body><header>Apply Online — Certificate Scheme (Government Portal)</header><main>
<div class="card">
  <p class="muted">Government of Example — scheme application portal. Apply online with your details.</p>
  <form onsubmit="return false">
    <label>Applicant name</label><input id="g-name">
    <label>Aadhaar number (synthetic)</label><input id="g-id" placeholder="XXXX XXXX XXXX">
    <button id="g-submit" type="submit">Submit application</button>
    <div class="ok-msg" id="g-ok">Application received — acknowledgement ID GN-2026-11452 (synthetic).</div>
  </form>
</div></main>
<script>
  document.getElementById('g-submit').addEventListener('click', () => {
    const n = document.getElementById('g-name').value, i = document.getElementById('g-id').value;
    if (n && i) { document.getElementById('g-ok').style.display = 'block'; document.title = 'Application received — Government Portal'; }
  });
</script></body></html>
