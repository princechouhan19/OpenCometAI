<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Example Search</title><style>* { box-sizing: border-box; margin: 0; } body { font: 14px/1.5 system-ui, sans-serif; color: #1a2233; background: #f6f7fb; } header { background: #16213e; color: #fff; padding: 14px 24px; font-size: 18px; font-weight: 600; } main { max-width: 900px; margin: 24px auto; padding: 0 16px; } .card { background: #fff; border: 1px solid #dfe4ef; border-radius: 10px; padding: 20px; margin-bottom: 18px; } label { display: block; margin: 10px 0 4px; font-weight: 600; font-size: 13px; } input { width: 100%; padding: 8px 10px; border: 1px solid #c3cbdd; border-radius: 6px; font: inherit; } button { background: #1d6ef5; border: 0; color: #fff; padding: 9px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 12px; } .ok-msg { color: #0a7d43; font-weight: 600; display: none; margin-top: 10px; }</style></head>
<body><header>Example Search</header><main>
<div class="card"><input id="search-box" placeholder="Search…"> <button id="search-btn">Search</button></div>
<div class="card" id="results" hidden><h3>Results</h3><ul><li>Quantum computing basics</li><li>Quantum entanglement, explained</li><li>Quantum sensors in practice</li></ul></div>
</main>
<script>
  document.getElementById('search-btn').addEventListener('click', () => {
    const q = document.getElementById('search-box').value;
    if (q) { document.getElementById('results').hidden = false; document.title = q + ' — Search results'; }
  });
</script></body></html>
