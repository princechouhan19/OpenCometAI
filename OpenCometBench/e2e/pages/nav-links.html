<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Example Portal</title><style>* { box-sizing: border-box; margin: 0; } body { font: 14px/1.5 system-ui, sans-serif; color: #1a2233; background: #f6f7fb; } header { background: #16213e; color: #fff; padding: 14px 24px; font-size: 18px; font-weight: 600; } main { max-width: 900px; margin: 24px auto; padding: 0 16px; } .card { background: #fff; border: 1px solid #dfe4ef; border-radius: 10px; padding: 20px; margin-bottom: 18px; } label { display: block; margin: 10px 0 4px; font-weight: 600; font-size: 13px; } input { width: 100%; padding: 8px 10px; border: 1px solid #c3cbdd; border-radius: 6px; font: inherit; } button { background: #1d6ef5; border: 0; color: #fff; padding: 9px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 12px; } .ok-msg { color: #0a7d43; font-weight: 600; display: none; margin-top: 10px; }</style></head>
<body><header>Example Portal — Home</header><main>
<div class="card"><nav>
<a href="#home" id="link-home">Home</a>
<a href="#products" id="link-products">Products</a>
<a href="#pricing" id="link-pricing">Pricing</a>
<a href="#blog" id="link-blog">Blog</a>
<a href="#contact" id="link-contact">Contact</a>
</nav></div>
<div class="card" id="content">Welcome. Use the navigation above.</div>
</main>
<script>
  const titles = { home: 'Home', products: 'Products', pricing: 'Pricing — Plans', blog: 'Blog', contact: 'Contact' };
  document.querySelectorAll('nav a').forEach(a => a.addEventListener('click', (e) => {
    e.preventDefault();
    document.getElementById('content').innerHTML = '<h1>' + titles[a.dataset.page || a.id.replace('link-','')] + '</h1><p>You are on ' + (a.dataset.page || a.id.replace('link-','')) + '.</p>';
    document.title = titles[a.id.replace('link-','')] + ' — Example Portal';
  }));
</script></body></html>
